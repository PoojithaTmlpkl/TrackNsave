<!DOCTYPE html>
<html>
<head>
  <title>TrackNSave</title>
  <link rel="stylesheet" href="../css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<div class="sidebar">
  <h2>TrackNSave</h2>
  <ul>
    <li class="active">Dashboard</li>
    <li>Expenses</li>
    <li>Savings</li>
    <li>Loans</li>
  </ul>
</div>

<div class="main">
  <h1>Welcome back, Alex!</h1>

  <div class="cards">
    <div class="card">Total Balance <h2>₹1,25,450</h2></div>
    <div class="card green">Savings <h2>₹75,000</h2></div>
    <div class="card red">Expenses <h2>₹32,200</h2></div>
    <div class="card purple">Loans <h2>₹50,000</h2></div>
  </div>

  <div class="charts">
    <canvas id="pieChart"></canvas>
    <canvas id="barChart"></canvas>
  </div>

  <div class="transactions">
    <h3>Recent Transactions</h3>
    <ul id="list"></ul>
  </div>
</div>

<script src="../js/app.js"></script>
</body>
</html>
